services:
  - type: web
    name: vaultis-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # LLM ตัวหลักคือ Claude Haiku 4.5 (analysis/llm.py) — เดิมประกาศแต่ Groq
      # backend บน Render จึงตกไปใช้ fallback ทุกครั้งโดยไม่มีใครตั้งใจ
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
