name: Vaultis Scheduler

on:
  schedule:
    - cron: '0 1 * * 1' # ทุกวันจันทร์ 08:00 Thailand
    - cron: '0 1 1 * *' # วันที่ 1 ทุกเดือน 08:00 Thailand
    - cron: '0 15 * * 1-5' # จันทร์-ศุกร์ 22:00 Thailand (หลัง US market เปิด 30 นาที)
  workflow_dispatch:

# ต้องเขียน repo ได้เพื่อบันทึกสถานะ alert ที่ trigger แล้ว (กันแจ้งเตือนซ้ำ)
permissions:
  contents: write

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          # 3.12 เท่ากับที่ Dockerfile และชุดเทสต์ 340 ตัวยืนยัน — เดิม CI รัน 3.11
          # อยู่คนละเวอร์ชันกับที่ทดสอบ บั๊กเฉพาะเวอร์ชันจะโผล่ใน production ก่อน
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Secrets ที่ต้องมี: GROQ_API_KEY, ANTHROPIC_API_KEY (Haiku 4.5 สำหรับ AI Advisor),
      # DISCORD_WEBHOOK_URL, FRED_API_KEY, NEWSAPI_KEY, DATABASE_URL
      - name: Run Sentiment Analysis
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1') }}
        run: python -c "from analysis.sentiment_analyzer import run_sentiment_job; run_sentiment_job()"
        env:
          # llm.py เลือก Claude Haiku 4.5 ก่อนเสมอ แล้วค่อยตกไป Groq — step นี้เคยส่งแค่ Groq
          # ทำให้ job เดียวในระบบที่วิ่งคนละโมเดลกับที่อื่นโดยไม่มีใครตั้งใจ
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: VaultisBot/1.0
      - name: Run Weekly Summary (วันจันทร์)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py --job weekly_summary
      - name: Run Monthly AI Advisor (วันที่ 1)
        if: github.event.schedule == '0 1 1 * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py --job monthly_advice
      - name: Daily price summary (ทุกวันทำการ)
        # `check_alerts()` ส่งสรุปราคา 5 ETF เข้า Discord ทุกครั้งที่รัน — ส่วนนี้ยังทำงานปกติ
        #
        # **แต่ CI มองไม่เห็น price alert ที่ผู้ใช้ตั้งไว้** เพราะ
        # `alerts/data/price_alerts.json` เป็นข้อมูลส่วนตัวและถูก gitignore
        # (repo นี้เป็น public — ข้อจำกัดเดียวกับ ledger ที่ AUDIT.md บันทึกไว้)
        # → alert รายตัวต้องรันจาก scheduler ในเครื่อง/Docker (`docker compose up -d`)
        #   ที่เห็นไฟล์จริงผ่าน volume
        #
        # เดิมมี step "Persist triggered alerts" commit ไฟล์นี้กลับเข้า repo เพื่อกัน
        # alert เด้งซ้ำ — ถอดออกแล้วเพราะการทำแบบนั้นคือการเผยแพร่ ticker + ราคาเป้าหมาย
        # ของผู้ใช้ลง public repo (มติผู้ใช้ 2026-07-28: ความเป็นส่วนตัวมาก่อน)
        if: github.event.schedule == '0 15 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --job price_alert
      - name: Run Daily Price Check (ทุกวันทำการ)
        if: github.event.schedule == '0 15 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: python jobs/daily_check.py
