# ชุดเทสต์อัตโนมัติที่ผูกกับการแก้โค้ด — AUDIT_2026-08-06 ข้อ 0-C (= D2)
#
# ก่อนมีไฟล์นี้ .github/workflows/ มี scheduler.yml ไฟล์เดียว ซึ่ง trigger เป็น
# schedule (3 cron) + workflow_dispatch เท่านั้น ⇒ `grep -rn "pytest" .github/`
# ว่างเปล่า และไม่มี trigger ใดผูกกับ push/PR เลย — ตัวเลข "ชุดเทสต์ผ่านกี่ตัว"
# จึงพึ่งวินัยของคนรันล้วน ๆ ไฟล์นี้ทำให้ทุกการแก้โค้ดถูกตรวจเอง
#
# ⚠️ ห้ามเพิ่ม `secrets.*` เข้า workflow นี้เด็ดขาด
#    ชุดเทสต์ต้องไม่เรียก LLM ที่เสียเงิน และต้องไม่ยิง Discord/Telegram/LINE จริง
#    (CLAUDE.md: "LLM ปิดโดยดีฟอลต์ งานอัตโนมัติต้องไม่จ่ายเงิน")
#    ถ้าเทสต์ตัวไหน "ต้องมีคีย์จริงถึงจะผ่าน" แปลว่าเทสต์ตัวนั้นผิด ไม่ใช่ CI ผิด
#    งานที่ต้องใช้ secret จริงอยู่ที่ scheduler.yml เท่านั้น
#
# ⚠️ ขึ้นกับข้อ 0-B: เทสต์ที่ยิง Yahoo จริง (test_etf_analysis, test_screener,
#    test_backtest, test_forecast) ถูกกันออกจากการรันปกติด้วย `@pytest.mark.network`
#    + `addopts = -m "not network"` ใน pytest.ini — ถ้าใครถอดออก CI นี้จะแดงเพราะ
#    เซิร์ฟเวอร์ภายนอกล่ม ไม่ใช่เพราะโค้ดในคอมมิต ซึ่งจะทำให้ทุกคนเลิกเชื่อ CI ทันที

name: tests

on:
  push:
  pull_request:

# อ่านอย่างเดียวพอ — workflow นี้ไม่เขียนอะไรกลับเข้า repo
permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ต้องตรงกับ Dockerfile (python:3.12-slim) ซึ่งเป็นเวอร์ชันที่ deploy จริง
          # requirements.txt pin ทุกตัว — ถ้า CI ทดสอบคนละเวอร์ชัน บั๊กเฉพาะเวอร์ชัน
          # จะไปโผล่ที่ production ก่อน (เหตุผลเดียวกับคอมเมนต์ใน scheduler.yml)
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ติดตั้ง dependencies
        # requirements-dev.txt ขาดไม่ได้: pytest.ini ตั้ง `asyncio_mode = auto`
        # ถ้าไม่มี pytest-asyncio ชุดเทสต์จะแดงเพราะเครื่องมือขาด ไม่ใช่เพราะโค้ด
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        # ขอบเขตของ "ชุดเทสต์" ถูกกำหนดที่ pytest.ini ที่เดียว (testpaths / addopts)
        # ห้ามเติม -m / --ignore / --deselect ตรงนี้ ไม่งั้นสิ่งที่ CI รันกับสิ่งที่คนรัน
        # ในเครื่องจะเป็นคนละชุดโดยไม่มีใครรู้
        run: pytest -q
        env:
          # ชุดเทสต์ต้องผ่านโดยไม่มีฐานข้อมูลเลย (เหมือน service `tests` ใน docker compose)
          DATABASE_URL: ""
          # SQLite ของเทสต์ต้องไม่ไปโผล่ที่ path ของฐานจริง (ข้อ 0-A / H1)
          VAULTIS_DB_PATH: ${{ runner.temp }}/test_vaultis.db
