[pytest]
; เทสต์จริงอยู่ใน tests/ เท่านั้น — root มี test_dcf.py ที่เป็นสคริปต์ demo
; (รันโค้ดตอน import) ถ้าไม่จำกัด testpaths จะทำ pytest collection ล่มทั้งชุด
testpaths = tests
; เทสต์ async (test_etf_analysis, test_screener) ต้องใช้ pytest-asyncio + โหมด auto
; ไม่มีบรรทัดนี้ pytest เปล่า ๆ จะ fail 2 ไฟล์ทั้งที่โค้ดปกติดี
asyncio_mode = auto
; root ต้องอยู่ใน sys.path ไม่งั้น `import utils` / `import analysis` ล่ม
; เดิมพึ่งพาผลข้างเคียงของ `python -m pytest` (คำสั่งนั้นใส่ cwd ให้เอง) ทำให้
; `pytest` เปล่า ๆ พังทันที — เจอตอนรันใน container ที่ CMD เรียก `pytest -q` ตรง ๆ
; (ModuleNotFoundError: No module named 'utils' ตอน load conftest)
pythonpath = .
markers =
    network: เทสต์ที่ต้องต่ออินเทอร์เน็ตจริง (yfinance/Prophet บนข้อมูลสด) — ถูกกันออกจากการรันปกติ
; AUDIT_2026-08-06 ข้อ 0-B: เทสต์ 4 ไฟล์ยิง Yahoo จริง ผลจึงขึ้นกับเซิร์ฟเวอร์ภายนอก
; ที่โปรเจกต์ไม่ได้คุม (เน็ตล่ม = ทั้งชุดล่ม) กันออกจากการรันปกติ เรียกกลับมาด้วย:
;   pytest -m network            รันเฉพาะที่ต้องต่อเน็ต
;   pytest -m "network or not network"   รันทั้งหมด
; หมายเหตุ: -m บนบรรทัดคำสั่งชนะค่าในนี้เสมอ (addopts ถูกวางไว้ก่อน argv)
; ตาข่ายกันพลาด: tests/test_offline_collection.py
addopts = -m "not network"
